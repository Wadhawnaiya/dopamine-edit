name: Offline regression tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install media test dependencies
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Check shell syntax
        run: find scripts skills -name '*.sh' -print0 | xargs -0 -n1 bash -n
      - name: Run isolated synthetic-media regressions
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 skills/dopamine-edit/scripts/test_pipeline.py
